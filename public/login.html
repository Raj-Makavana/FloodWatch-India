<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – FloodWatch India</title>
  <meta name="description" content="Sign in to FloodWatch India – Access secure telemetry and regional flood risk data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/toast.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:    #0b1120;
      --bg-card:    #0d1526;
      --bg-input:   #0a1020;
      --accent:     #1a6dff;
      --border:     rgba(30, 80, 180, 0.28);
      --border-input: rgba(30, 80, 180, 0.35);
      --text:       #dde6f5;
      --text-dim:   #7a8faa;
      --text-label: #8a9bb5;
      --green:      #22c55e;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-page);
      color: var(--text);
    }

    .top-bar { height: 2px; background: var(--green); width: 100%; }

    .tab-label {
      font-size: 11px;
      color: var(--text-dim);
      padding: 8px 20px;
      letter-spacing: 0.5px;
      background: #0b1120;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .page-body {
      min-height: calc(100vh - 50px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #d94326 0%, #b83520 100%);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 4px 20px rgba(217,67,38,0.35);
    }

    .card-title { text-align: center; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .card-sub { text-align: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 28px; }

    .field { margin-bottom: 18px; }
    .field-label {
      display: block; font-size: 10.5px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--text-label); margin-bottom: 7px;
    }
    .field-input {
      width: 100%; background: var(--bg-input);
      border: 1px solid var(--border-input); border-radius: 7px;
      padding: 10px 13px; font-size: 13px; color: var(--text);
      font-family: 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-input::placeholder { color: rgba(138,155,181,0.5); }
    .field-input:focus { border-color: rgba(26,109,255,0.6); box-shadow: 0 0 0 3px rgba(26,109,255,0.12); }

    .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 10px; }

    .check-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .check-wrap input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .check-label { font-size: 12px; color: var(--text-dim); }

    .forgot-link { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; transition: color 0.2s; }
    .forgot-link:hover { color: #7bb3ff; text-decoration: underline; }

    .btn-primary {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #1a6dff 0%, #0d50cc 100%);
      border: none; border-radius: 8px; color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
      margin-bottom: 18px; box-shadow: 0 4px 16px rgba(26,109,255,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(26,109,255,0.45); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .or-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .or-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
    .or-text { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }

    .btn-google {
      width: 100%; padding: 11px; background: transparent;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
      color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 24px;
    }
    .btn-google:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.22); }
    .btn-google:disabled { opacity: 0.7; cursor: not-allowed; }

    .google-icon {
      width: 18px; height: 18px;
      border: 1.5px solid var(--text-dim); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--text-dim); flex-shrink: 0;
      font-weight: 700;
    }

    .bottom-link { text-align: center; font-size: 12.5px; color: var(--text-dim); }
    .bottom-link a { color: var(--accent); text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .bottom-link a:hover { color: #7bb3ff; text-decoration: underline; }

    .bottom-bar { height: 2px; background: var(--green); width: 100%; position: fixed; bottom: 0; left: 0; }
  </style>
</head>
<body>

  <div class="top-bar"></div>

  <div class="page-body">
    <div class="card">

      <div class="brand-icon">≋</div>
      <div class="card-title">Sign In</div>
      <div class="card-sub">Access secure telemetry &amp; regional risk data</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label class="field-label" for="email">Institutional Email</label>
          <input class="field-input" id="email" type="email" placeholder="name@gov.in or name@academic.edu" autocomplete="email" required />
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input class="field-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <div class="row-between">
          <label class="check-wrap">
            <input type="checkbox" id="remember" checked />
            <span class="check-label">Remember this terminal</span>
          </label>
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" id="btnLogin">Sign In</button>
      </form>

      <div class="or-divider">
        <div class="or-line"></div>
        <span class="or-text">OR</span>
        <div class="or-line"></div>
      </div>

      <button type="button" class="btn-google" id="btnGoogle" onclick="handleGoogle()">
        <span class="google-icon">G</span>
        Continue with Google
      </button>

      <div class="bottom-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>

    </div>
  </div>

  <div class="bottom-bar"></div>

  <script src="assets/toast.js"></script>
  <script>
    const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:5000/api/auth' : '/api/auth';
    let isSubmitting = false;

    // Check query params for Google OAuth status
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'google_failed') {
        showToast('Google authentication failed. Please try again.', 'error');
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (urlParams.get('error') === 'google_denied') {
        showToast('Google sign-in was cancelled.', 'warning');
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      if (isSubmitting) return;

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const btn = document.getElementById('btnLogin');

      // Validation
      if (!email) {
        showToast('Please enter your email.', 'error');
        return;
      }
      if (!password) {
        showToast('Please enter your password.', 'error');
        return;
      }

      isSubmitting = true;
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          showToast('Login successful.', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          showToast(data.message || 'Invalid email or password.', 'error');
          btn.textContent = 'Sign In';
          btn.disabled = false;
          isSubmitting = false;
        }
      } catch (err) {
        showToast('Unable to connect. Please try again.', 'error');
        btn.textContent = 'Sign In';
        btn.disabled = false;
        isSubmitting = false;
      }
    }

    function handleGoogle() {
      const btnGoogle = document.getElementById('btnGoogle');
      btnGoogle.disabled = true;
      showToast('Redirecting to Google...', 'info');
      setTimeout(() => {
        window.location.href = `${API_BASE}/google`;
      }, 500);
    }
  </script>
</body>
</html>
